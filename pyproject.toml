[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrueup"
version = "0.2.0"
description = "Trust, but reconcile — verify what your AI coding agent said against what your filesystem and git actually show."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agenttrueup contributors" }]
keywords = [
  "ai", "agents", "claude", "codex", "audit", "verification",
  "claude-code", "security", "secrets", "trust-but-verify",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
trueup = "agenttrueup.cli:main"

[project.urls]
Homepage = "https://github.com/Yuh302331-ctrl/agenttrueup"
Issues = "https://github.com/Yuh302331-ctrl/agenttrueup/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
